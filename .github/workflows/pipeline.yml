name: Pipeline Node

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v3   # 🔴 CLAVE

    - name: Ver archivos
      run: ls -l                  # 👈 DEBUG (muy útil)

    - name: Instalar Node
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Instalar dependencias
      run: npm install

    - name: Ejecutar app
      run: npm start
