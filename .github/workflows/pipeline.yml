name: Pipeline Node

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ✅ 1. Checkout con version clara
    - name: Checkout
      uses: actions/checkout@v4

    # ✅ 2. DEBUG COMPLETO
    - name: Mostrar info repo
      run: |
        echo "PWD:"
        pwd
        echo "-----"
        echo "Contenido raíz:"
        ls -la
        echo "-----"
        echo "Árbol completo:"
        find .

    # ✅ 3. Instalar Node
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # ✅ 4. Ejecutar npm SOLO si existe package.json
    - name: Instalar dependencias
      run: |
        if [ -f package.json ]; then
          npm install
        else
          echo "ERROR: package.json NO encontrado"
          exit 1
        fi

    # ✅ 5. Ejecutar app
    - name: Ejecutar app
      run: npm start
